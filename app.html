<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffdf8"><title>简厨 App 原型</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .app-shell{min-height:100vh;max-width:980px;margin:auto;padding:2rem clamp(1.2rem,4vw,4rem) 5rem}.app-top{display:flex;justify-content:space-between;padding:1rem 0 2rem}.app-top a{color:var(--muted);text-decoration:none}.app-frame{max-width:460px;margin:2rem auto 0;padding:1.15rem;border:1px solid var(--line);border-radius:2rem;background:#f5f6f2;box-shadow:0 1.5rem 3rem rgba(37,34,31,.12)}.app-screen{min-height:690px;padding:1.2rem;border-radius:1.4rem;background:var(--paper)}
    .app-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;margin-top:2rem;padding:.3rem;border-radius:999px;background:#edf0ea}.app-nav button{border:0;border-radius:999px;padding:.7rem .3rem;background:transparent;color:var(--muted);cursor:pointer;font-size:.78rem}.app-nav button.active{background:var(--ink);color:var(--paper)}.app-panel{display:none}.app-panel.active{display:block}.app-copy h1{font:800 clamp(2.4rem,6vw,4.2rem)/.95 var(--display);letter-spacing:-.07em;margin:0 0 .8rem}.app-copy h1 span{color:var(--orange)}.app-copy p{color:var(--muted);margin:0}.app-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin:1.1rem 0}.app-actions button{border:0;border-radius:999px;padding:.75rem 1rem;background:var(--orange);color:#fff;cursor:pointer;font-weight:700}.app-actions button.secondary{background:var(--ink)}
    .mini-fridge{position:relative;height:275px;margin:1rem 0 1.5rem;perspective:800px}.mini-inside,.mini-door{position:absolute;inset:0;border-radius:1.2rem}.mini-inside{padding:1.1rem;background:linear-gradient(135deg,#fff6dd,#d6e8d1);overflow:hidden}.mini-inside:before{content:"";position:absolute;inset:2rem 1.2rem 3.4rem;border-radius:.8rem;background:rgba(255,255,255,.68)}.mini-shelf{position:relative;z-index:1;height:1px;margin:3.7rem 1rem 0;background:rgba(37,34,31,.2)}.mini-shelf+.mini-shelf{margin-top:4rem}.mini-food{position:absolute;z-index:2;bottom:4.3rem;left:2.6rem;display:flex;gap:.5rem}.mini-food i{display:block;width:2.2rem;height:2.2rem;border-radius:.5rem;background:var(--orange)}.mini-food i:nth-child(2){background:var(--yellow)}.mini-food i:nth-child(3){background:var(--green)}.mini-door{z-index:3;transform-origin:left center;background:linear-gradient(110deg,#fffefa,#d6d2c9);box-shadow:.5rem 1rem 1rem rgba(37,34,31,.12);transition:transform .8s cubic-bezier(.22,1,.36,1)}.mini-fridge.open .mini-door{transform:rotateY(-74deg)}.mini-door:after{content:"简厨";position:absolute;left:0;right:0;bottom:2.5rem;text-align:center;color:var(--orange);font-weight:700;font-size:1.4rem}.mini-handle{position:absolute;right:1.1rem;top:28%;width:.4rem;height:6rem;border-radius:99px;background:#9f988d}.expiry-list,.meal-list{display:grid;gap:.6rem;margin:1rem 0}.expiry-item,.meal-item{display:flex;align-items:center;gap:.8rem;padding:.9rem 1rem;border-radius:1rem;background:#fff;border:1px solid var(--line)}.expiry-item span,.meal-item span{margin-left:auto;color:var(--muted);font-size:.75rem}.warn{color:var(--orange)!important}.app-note{margin-top:2rem;font:.7rem var(--mono);color:var(--muted)}
  </style>
</head>
<body>
  <main class="app-shell"><div class="app-top"><a href="index.html">← 回到简厨网站</a><span class="eyebrow"><span class="dot dot-orange"></span> JIANCHU APP</span></div><div class="app-frame"><div class="app-screen">
    <section class="app-panel active" data-panel="fridge"><div class="app-copy"><p class="eyebrow"><span class="dot dot-green"></span> 一顿饭，从家里开始</p><h1>打开冰箱，<br><span>先用什么？</span></h1><p>只留下今天真正需要的三件事。</p></div><div class="mini-fridge" data-mini-fridge><div class="mini-inside"><div class="mini-shelf"></div><div class="mini-shelf"></div><div class="mini-food"><i></i><i></i><i></i></div></div><button class="mini-door" data-open-door aria-label="打开冰箱门"><span class="mini-handle"></span></button></div><div class="app-actions"><button data-open-door>打开冰箱</button><button class="secondary" data-go="tonight">今晚吃什么 →</button></div><div class="expiry-list"><div class="expiry-item"><b>番茄</b><span class="warn">明天到期</span></div><div class="expiry-item"><b>鸡蛋</b><span class="warn">2 天后到期</span></div></div></section>
    <section class="app-panel" data-panel="tonight"><div class="app-copy"><p class="eyebrow"><span class="dot dot-yellow"></span> 根据现有食材</p><h1>今晚<br><span>刚好一碗。</span></h1><p>番茄鸡蛋面 · 15 分钟 · 2 人份</p></div><div class="app-actions"><button data-toast>记住这个晚餐</button><button class="secondary" data-go="fridge">回冰箱</button></div><div class="meal-list"><div class="meal-item"><b>番茄鸡蛋面</b><span>已有 3 / 缺 0</span></div><div class="meal-item"><b>清炒时蔬豆腐</b><span>已有 2 / 缺 1</span></div></div></section>
    <section class="app-panel" data-panel="plan"><div class="app-copy"><p class="eyebrow"><span class="dot dot-orange"></span> 少买一点</p><h1>下次采购，<br><span>只买缺的。</span></h1><p>计划需求减去冰箱库存，自动留下清单。</p></div><div class="meal-list"><div class="meal-item"><b>青菜</b><span>1 把</span></div><div class="meal-item"><b>豆腐</b><span>1 盒</span></div></div><div class="app-actions"><button data-toast>分享购物清单</button></div></section>
    <nav class="app-nav" aria-label="App 页面"><button class="active" data-tab="fridge">冰箱</button><button data-tab="tonight">今晚</button><button data-tab="plan">计划</button></nav><p class="app-note">原型：只保留三个核心页面。设置、识别和全部库存从次级入口进入。</p>
  </div></div></main><div class="toast" data-toast-message role="status" aria-live="polite">已记住。今晚就吃这个。</div>
  <script>const panels=[...document.querySelectorAll('[data-panel]')],tabs=[...document.querySelectorAll('[data-tab]')],fridge=document.querySelector('[data-mini-fridge]'),toast=document.querySelector('[data-toast-message]');function show(n){panels.forEach(p=>p.classList.toggle('active',p.dataset.panel===n));tabs.forEach(t=>t.classList.toggle('active',t.dataset.tab===n))}tabs.forEach(t=>t.addEventListener('click',()=>show(t.dataset.tab)));document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));document.querySelectorAll('[data-open-door]').forEach(b=>b.addEventListener('click',()=>fridge.classList.toggle('open')));document.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>{toast.classList.add('is-visible');setTimeout(()=>toast.classList.remove('is-visible'),2200)}));</script>
</body></html>
